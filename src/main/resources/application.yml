server:
  port: 8085
  ssl:
    enabled: false

logging:
  level:
    org.apache.coyote: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG



springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha


spring:
  datasource:
    url: jdbc:mysql://localhost/hogar360-user
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

appDescription: "Hogar360 API"
appVersion: "1.0.0"